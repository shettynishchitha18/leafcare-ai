<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="60%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <radialGradient id="targetSpot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#21130d"/>
      <stop offset="30%" stop-color="#4e2716"/>
      <stop offset="60%" stop-color="#8d4b20"/>
      <stop offset="85%" stop-color="#d4a32e"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="targetSpot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c0f0a"/>
      <stop offset="35%" stop-color="#4a2414"/>
      <stop offset="70%" stop-color="#99571f"/>
      <stop offset="90%" stop-color="#cbb034"/>
      <stop offset="100%" stop-color="#2E7D32" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#05240c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" fill="#f4faf5" rx="16"/>
  
  <!-- Leaf Stem & Main Blade -->
  <g filter="url(#shadow)" transform="translate(20, 20)">
    <!-- Main stem -->
    <path d="M180,340 Q175,220 180,30" stroke="#1b4d1b" stroke-width="7" fill="none" stroke-linecap="round"/>
    
    <!-- Tomato Leaf Serrated Shape -->
    <path d="M180,30 C230,60 280,100 270,160 C265,190 285,210 275,250 C265,290 220,310 180,330 C140,310 95,290 85,250 C75,210 95,190 90,160 C80,100 130,60 180,30 Z" 
          fill="url(#leafGrad)"/>

    <!-- Vein network -->
    <path d="M180,290 Q220,260 255,250" stroke="#7cb342" stroke-width="3" fill="none"/>
    <path d="M180,290 Q140,260 105,250" stroke="#7cb342" stroke-width="3" fill="none"/>
    <path d="M180,220 Q230,190 265,175" stroke="#7cb342" stroke-width="3.5" fill="none"/>
    <path d="M180,220 Q130,190 95,175" stroke="#7cb342" stroke-width="3.5" fill="none"/>
    <path d="M180,140 Q225,120 255,100" stroke="#7cb342" stroke-width="3" fill="none"/>
    <path d="M180,140 Q135,120 105,100" stroke="#7cb342" stroke-width="3" fill="none"/>
    <path d="M180,80 Q210,65 235,50" stroke="#7cb342" stroke-width="2" fill="none"/>
    <path d="M180,80 Q150,65 125,50" stroke="#7cb342" stroke-width="2" fill="none"/>

    <!-- Early Blight Concentric Target Spots -->
    <!-- Large lower spot with concentric rings -->
    <circle cx="140" cy="225" r="42" fill="url(#targetSpot1)"/>
    <ellipse cx="140" cy="225" rx="30" ry="28" fill="none" stroke="#2a140a" stroke-width="2.5" opacity="0.8"/>
    <ellipse cx="140" cy="225" rx="20" ry="18" fill="none" stroke="#2a140a" stroke-width="2" opacity="0.9"/>
    <ellipse cx="140" cy="225" rx="10" ry="9" fill="#1b0b05"/>

    <!-- Secondary spot -->
    <circle cx="215" cy="160" r="32" fill="url(#targetSpot2)"/>
    <ellipse cx="215" cy="160" rx="22" ry="20" fill="none" stroke="#33180c" stroke-width="2" opacity="0.8"/>
    <ellipse cx="215" cy="160" rx="13" ry="12" fill="none" stroke="#33180c" stroke-width="1.8" opacity="0.9"/>
    <circle cx="215" cy="160" r="6" fill="#150804"/>

    <!-- Smaller auxiliary spots -->
    <circle cx="160" cy="110" r="16" fill="url(#targetSpot1)"/>
    <circle cx="230" cy="245" r="18" fill="url(#targetSpot2)"/>
    <circle cx="115" cy="170" r="12" fill="#522a15" opacity="0.9"/>
    
    <!-- Chlorotic yellow halo zone around spots -->
    <path d="M95,260 Q80,240 105,210 Q160,200 170,250 Z" fill="#d4c832" opacity="0.35"/>
    <path d="M200,140 Q250,130 260,180 Q220,195 200,140 Z" fill="#d4c832" opacity="0.3"/>
  </g>

  <!-- Plant/Disease Badge -->
  <rect x="20" y="345" width="360" height="38" rx="8" fill="#1b3820" opacity="0.92"/>
  <text x="35" y="369" fill="#81c784" font-family="system-ui, sans-serif" font-size="13" font-weight="700">TOMATO PLANT</text>
  <text x="365" y="369" fill="#ffb74d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">EARLY BLIGHT</text>
</svg>
